<!DOCTYPE html>
<html>
<head>
    <title>URL Debug Test</title>
</head>
<body>
    <h1>URL Debug Test</h1>
    <div id="output"></div>

    <script>
        async function testURLs() {
            const response = await fetch('http://localhost:3000/api/influencers/inf_1785044475094355/posts?limit=3');
            const data = await response.json();

            const output = document.getElementById('output');
            output.innerHTML = '<h2>API Response:</h2>';

            data.data.items.forEach((post, idx) => {
                output.innerHTML += `
                    <div style="border: 1px solid #ccc; padding: 10px; margin: 10px 0;">
                        <p><strong>Post ${idx + 1}:</strong> ${post.content}</p>
                        <p><strong>URL from API:</strong> <code>${post.url}</code></p>
                        <p><a href="${post.url}" target="_blank">测试链接</a></p>
                        <p><strong>URL type:</strong> ${typeof post.url}</p>
                        <p><strong>URL length:</strong> ${post.url ? post.url.length : 0}</p>
                    </div>
                `;
            });
        }

        testURLs();
    </script>
</body>
</html>
