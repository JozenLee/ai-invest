name: CI Tests

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  api-tests:
    name: API层测试
    runs-on: ubuntu-latest

    services:
      # Python数据服务
      data-service:
        image: python:3.11
        ports:
          - 8000:8000

    steps:
      - uses: actions/checkout@v3

      - name: 设置Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          cache: 'npm'

      - name: 设置Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: 安装Node依赖
        run: npm ci

      - name: 安装Python依赖
        run: |
          cd data-service
          pip install -r requirements.txt

      - name: 启动数据服务
        run: |
          cd data-service
          python main.py &
          sleep 10
        env:
          PYTHONUNBUFFERED: 1

      - name: 启动Next.js应用
        run: |
          npm run build
          npm start &
          sleep 15

      - name: 运行API测试
        run: npm run test:api

      - name: 上传测试报告
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: api-test-results
          path: test-results/

  e2e-tests:
    name: E2E测试
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: 设置Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          cache: 'npm'

      - name: 设置Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: 安装依赖
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: 安装Python依赖
        run: |
          cd data-service
          pip install -r requirements.txt

      - name: 启动数据服务
        run: |
          cd data-service
          python main.py &
          sleep 10

      - name: 运行E2E测试
        run: npm run test:e2e
        env:
          CI: true

      - name: 上传测试报告
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: e2e-test-results
          path: |
            playwright-report/
            test-results/

      - name: 上传失败截图
        if: failure()
        uses: actions/upload-artifact@v3
        with:
          name: e2e-screenshots
          path: test-results/**/*.png

  coverage:
    name: 测试覆盖率
    runs-on: ubuntu-latest
    needs: [api-tests]

    steps:
      - uses: actions/checkout@v3

      - name: 设置Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          cache: 'npm'

      - name: 安装依赖
        run: npm ci

      - name: 生成覆盖率报告
        run: npm run test:coverage

      - name: 上传覆盖率报告
        uses: codecov/codecov-action@v3
        with:
          files: ./coverage/coverage-final.json
          flags: unittests
          name: codecov-umbrella
