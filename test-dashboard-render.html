<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Dashboard UI Test</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; }
        .card { border: 1px solid #ddd; padding: 15px; margin: 10px; display: inline-block; min-width: 200px; }
        .success { color: green; }
        .error { color: red; }
    </style>
</head>
<body>
    <h1>资金流向增强UI测试</h1>
    <div id="result"></div>

    <script>
        async function testDashboard() {
            const result = document.getElementById('result');

            try {
                // 获取API数据
                const response = await fetch('http://localhost:3000/api/market/capital-flow');
                const apiData = await response.json();

                if (!apiData.success) {
                    throw new Error('API返回失败');
                }

                const data = apiData.data;

                // 模拟formatNumber函数
                function formatNumber(num, decimals = 2) {
                    if (num === undefined || num === null || isNaN(num)) return '0.00';
                    return num.toFixed(decimals);
                }

                // 渲染卡片
                let html = '<h2 class="success">✅ API数据获取成功</h2>';

                // 持续流入趋势
                if (data.consecutiveTrend) {
                    html += `
                        <div class="card">
                            <h3>持续流入趋势</h3>
                            <p><strong>${data.consecutiveTrend.totalNet >= 0 ? '+' : ''}${formatNumber(data.consecutiveTrend.totalNet)}亿</strong></p>
                            <p>方向: ${data.consecutiveTrend.direction === 'inflow' ? '流入' : '流出'}</p>
                            <p>强度: ${data.consecutiveTrend.strength}</p>
                        </div>
                    `;
                }

                // 成交量放大
                if (data.volumeAmplification) {
                    html += `
                        <div class="card">
                            <h3>成交量放大</h3>
                            <p><strong>${formatNumber(data.volumeAmplification.amplification)}x</strong></p>
                            <p>${data.volumeAmplification.isAmplified ? '成交活跃' : '成交正常'}</p>
                        </div>
                    `;
                }

                // 价格资金背离
                if (data.priceFlowDivergence) {
                    html += `
                        <div class="card">
                            <h3>价格资金背离</h3>
                            <p><strong>${data.priceFlowDivergence.isDivergent ?
                                (data.priceFlowDivergence.divergenceType === 'bullish' ? '看多背离' : '看空背离') :
                                '无背离'}</strong></p>
                            <p>价格变化: ${data.priceFlowDivergence.priceChange >= 0 ? '+' : ''}${formatNumber(data.priceFlowDivergence.priceChange)}%</p>
                        </div>
                    `;
                }

                // 龙虎榜
                if (data.institutionalBehavior?.dragonTiger) {
                    html += `
                        <div class="card">
                            <h3>龙虎榜</h3>
                            <p><strong>${data.institutionalBehavior.dragonTiger.count}只</strong></p>
                            <p>上榜股票</p>
                        </div>
                    `;
                }

                // 北向资金
                if (data.institutionalBehavior?.northboundCapital) {
                    const nb = data.institutionalBehavior.northboundCapital;
                    const hasData = nb.net !== 0;
                    html += `
                        <div class="card">
                            <h3>北向资金</h3>
                            ${hasData ? `
                                <p><strong>${nb.net >= 0 ? '+' : ''}${formatNumber(nb.net)}亿</strong></p>
                                <p>沪股通 ${formatNumber(nb.shConnect)}亿 · 深股通 ${formatNumber(nb.szConnect)}亿</p>
                            ` : `
                                <p><strong>暂无</strong></p>
                            `}
                        </div>
                    `;
                }

                html += '<h3 class="success">✅ 所有卡片渲染正常，无错误</h3>';
                result.innerHTML = html;

            } catch (error) {
                result.innerHTML = `<h2 class="error">❌ 错误: ${error.message}</h2>`;
                console.error('测试失败:', error);
            }
        }

        // 页面加载后执行测试
        window.onload = testDashboard;
    </script>
</body>
</html>
